id: EXP-012
name: lstm-window24
phase: dev
parent: EXP-011
changed: lstm.window
reason: ARIMA 실험(EXP-003~009)에서 10분 뒤 예측은 최근 흐름이 대부분을 설명했다. LSTM 입력 창을 지난 하루(144칸)에서 지난 4시간(24칸)으로 줄여 같은 교훈이 LSTM에도 맞는지 확인한다
hypothesis: 창이 짧으면 "어제 이 시각(금요일)"을 입력으로 보지 않으므로 주말 오차(토 94.8, 일 103.1)가 줄고, 평일 성능은 비슷하게 유지되어 val MAE가 EXP-011(103.01)보다 낮아진다. 창이 짧아 학습 샘플도 약 120개 늘어난다
model:
  type: lstm
lstm:
  window: 24
  hidden: 64
  layers: 1
  dropout: 0.0
  lr: 0.001
  batch: 256
  max_epochs: 100
  patience: 5
  scaler: standard
