[project]
name = "tp"
version = "0.1.0"
description = "Milan mobile internet traffic: 10-minute-ahead forecasting experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "torch>=2.3",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "filelock>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
